<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MediScan AI — Auth</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>
body {
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: radial-gradient(circle at top, #0a0f1f, #05070d);
    font-family:'Inter',sans-serif;
    color:#eaf2ff;
}

/* glowing orb */
body::before{
    content:'';
    position:absolute;
    width:400px;height:400px;
    background:#3a86ff;
    filter:blur(120px);
    opacity:.2;
}

.container{
    width:360px;
    padding:30px;
    border-radius:18px;
    backdrop-filter: blur(20px);
    background: rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.1);
    box-shadow:0 0 40px rgba(0,0,0,0.5);
}

.title{
    text-align:center;
    font-family:'Orbitron';
    font-size:24px;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:12px;
    border:none;
    border-radius:10px;
    background:rgba(255,255,255,0.07);
    color:white;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg,#3a86ff,#00f2fe);
    color:white;
    cursor:pointer;
}

.toggle{
    display:flex;
    margin-bottom:15px;
}
.toggle button{
    flex:1;
    background:none;
    border:1px solid rgba(255,255,255,0.2);
}
.toggle .active{
    background:#3a86ff;
}

#msg{ text-align:center; margin-top:10px; }
</style>
</head>

<body>

<div class="container">
<div class="title">MediScan AI</div>

<div class="toggle">
<button id="loginBtn" class="active">Login</button>
<button id="registerBtn">Register</button>
</div>

<div id="loginForm">
<input id="loginEmail" placeholder="Email">
<input id="loginPassword" type="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<div id="registerForm" style="display:none;">
<input id="name" placeholder="Name">
<input id="email" placeholder="Email">
<input id="password" placeholder="Password">
<button onclick="register()">Register</button>
</div>

<p id="msg"></p>
</div>

<script>
const API="http://localhost:8080";

loginBtn.onclick=()=>{loginForm.style.display="block";registerForm.style.display="none";}
registerBtn.onclick=()=>{loginForm.style.display="none";registerForm.style.display="block";}

function register(){
fetch(API+"/user/register",{method:"POST",headers:{"Content-Type":"application/json"},
body:JSON.stringify({name:name.value,emailId:email.value,password:password.value})})
.then(r=>r.text()).then(t=>msg.innerText=t);
}

function login(){
fetch(API+"/user/login",{method:"POST",headers:{"Content-Type":"application/json"},
body:JSON.stringify({emailId:loginEmail.value,password:loginPassword.value})})
.then(r=>r.text()).then(t=>{
if(t.toLowerCase().includes("success")){
localStorage.setItem("mediUser",JSON.stringify({name:"User"}));
window.location.assign("upload.html");
}else msg.innerText=t;
});
}
</script>

</body>
</html>
